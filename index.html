<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Julia Lim | Portfolio</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/99915b2394.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="style/main.css">
</head>

<body>
    <!-- Decorative background -->
    <div class="background">
        <div class="orb orb-one"></div>
        <div class="orb orb-two"></div>
        <div class="orb orb-three"></div>
        <div class="stars"></div>
    </div>

    <main class="portfolio">

        <!-- HERO -->
        <section class="hero">
            <div class="hero-copy">
                <span class="eyebrow">
                    <span class="eyebrow-dot"></span>
                    Welcome to my little corner of the internet
                </span>

                <h1>Julia <span>Lim</span></h1>

                <p class="hero-description">
                    Digital marketing, operations, customer experience,

                </p>

                <div class="hero-tags">
                    <span>Digital Marketing</span>
                    <span>Operations</span>
                    <span>Creative</span>
                </div>
            </div>

            <button class="hero-photo" onclick="showCard('personal-info')" aria-label="Open personal information">
                <div class="photo-glow"></div>
                <img src="Oreo.png" alt="Oreo, Julia's puppy">
                <span class="photo-badge">
                    <i class="fa-solid fa-heart"></i>
                </span>
            </button>
        </section>

        <!-- NAVIGATION GRID -->
        <section class="portfolio-grid" aria-label="Portfolio sections">

            <button class="portfolio-card about-card" onclick="showCard('personal-info')">
                <span class="card-number">01</span>
                <span class="card-icon"><i class="fa-regular fa-user"></i></span>
                <span class="card-copy">
                    <small>GET TO KNOW ME</small>
                    <strong>About Me</strong>
                </span>
                <span class="card-arrow"><i class="fa-solid fa-arrow-up-right-from-square"></i></span>
            </button>

            <button class="portfolio-card experience-card" onclick="showCard('experience')">
                <span class="card-number">02</span>
                <span class="card-icon"><i class="fa-solid fa-briefcase"></i></span>
                <span class="card-copy">
                    <small>MY JOURNEY</small>
                    <strong>Experience</strong>
                </span>
                <span class="card-arrow"><i class="fa-solid fa-arrow-up-right-from-square"></i></span>
            </button>

            <button class="portfolio-card skills-card" onclick="showCard('skills')">
                <span class="card-number">03</span>
                <span class="card-icon"><i class="fa-solid fa-sparkles"></i></span>
                <span class="card-copy">
                    <small>WHAT I CAN DO</small>
                    <strong>Skills</strong>
                </span>
                <span class="card-arrow"><i class="fa-solid fa-arrow-up-right-from-square"></i></span>
            </button>

            <button class="portfolio-card language-card" onclick="showCard('language')">
                <span class="card-number">04</span>
                <span class="card-icon"><i class="fa-solid fa-language"></i></span>
                <span class="card-copy">
                    <small>COMMUNICATION</small>
                    <strong>Languages</strong>
                </span>
                <span class="card-arrow"><i class="fa-solid fa-arrow-up-right-from-square"></i></span>
            </button>

            <button class="portfolio-card hobby-card" onclick="showCard('details')">
                <span class="card-number">05</span>
                <span class="card-icon"><i class="fa-regular fa-heart"></i></span>
                <span class="card-copy">
                    <small>BEYOND WORK</small>
                    <strong>Hobbies</strong>
                </span>
                <span class="card-arrow"><i class="fa-solid fa-arrow-up-right-from-square"></i></span>
            </button>

            <button class="portfolio-card pictures-card" onclick="showCard('pictures')">
                <span class="card-number">06</span>
                <span class="card-icon"><i class="fa-regular fa-images"></i></span>
                <span class="card-copy">
                    <small>LITTLE MOMENTS</small>
                    <strong>Pictures</strong>
                </span>
                <span class="card-arrow"><i class="fa-solid fa-arrow-up-right-from-square"></i></span>
            </button>

            <button class="portfolio-card connect-card" onclick="showCard('connect')">
                <span class="card-number">07</span>
                <span class="card-icon"><i class="fa-regular fa-paper-plane"></i></span>
                <span class="card-copy">
                    <small>LET'S TALK</small>
                    <strong>Connect</strong>
                </span>
                <span class="card-arrow"><i class="fa-solid fa-arrow-up-right-from-square"></i></span>
            </button>

        </section>

        <footer>
            <span>Made with curiosity &amp; a little sparkle</span>
            <span>© <span id="year"></span> Julia Lim</span>
        </footer>
    </main>

    <!-- MODAL -->
    <div class="modal-overlay" id="overlay" onclick="hideCard()">
        <div class="modal" id="card" role="dialog" aria-modal="true" aria-labelledby="card-title" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="hideCard()" aria-label="Close">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="modal-header">
                <span class="modal-label">EXPLORE</span>
                <h2 id="card-title">Title</h2>
                <div class="modal-line"></div>
            </div>

            <div class="modal-body" id="card-description"></div>
        </div>
    </div>

                            <a href="https://www.linkedin.com/in/julia-lim-b32570244/" target="_blank" rel="noopener" aria-label="LinkedIn">
                                <i class="fa-brands fa-linkedin-in"></i>
                            </a>

            "experience": {

                                    experience.

                        <div class="timeline-item">
                            <div class="timeline-dot"></div>
                            <div class="timeline-date">JUNE 2023</div>

                        <div class="timeline-item">
                            <div class="timeline-dot"></div>
                            <div class="timeline-date">SEP 2024</div>
                            <div class="timeline-content">
                                <span class="timeline-type">DIGITAL MARKETING</span>
                                <h3>Digital Marketing Strategy</h3>
                                <p>
                                    Developed and led digital marketing strategies,
                                    managing a team to increase brand awareness,
                                    website traffic, and leads through SEO, SEM,
                                    and content marketing.
                                </p>

                                <div class="achievement">

                                    <span>organic traffic increase</span>
                                </div>
                            </div>
                        </div>

                    </div>
                `
            },

            "skills": {
                title: "Skills",
                description: `
                    <div class="skills-intro">
                        <span class="mini-label">MY TOOLKIT</span>
                        <p>
                            A mix of people skills, technical abilities, creativity,
                            and analytical thinking.
                        </p>
                    </div>

                    <div class="skills-grid">

                        <div class="skill-panel">
                            <div class="skill-panel-header">
                                <div class="skill-panel-icon">
                                    <i class="fa-solid fa-people-group"></i>
                                </div>
                                <div>
                                    <span>01</span>
                                    <h3>Soft Skills</h3>
                                </div>
                            </div>

                            <div class="skill-list">
                                <span>Problem Solving</span>

                                <span>Responsibility</span>

                                <span>Attention to Detail</span>

                        </div>

                        <div class="skill-panel featured">
                            <div class="skill-panel-header">
                                <div class="skill-panel-icon">

                                </div>

                                <span>Data Analysis</span>
                                <span>Banner Designing</span>
                            </div>
                        </div>

                    </div>
                `
            },

            "language": {
                title: "Languages",
                description: `
                    <div class="language-list">

                        <div class="language-row">
                            <div class="language-heading">
                                <strong>English</strong>
                                <span>Fluent</span>
                            </div>
                            <div class="language-track">
                                <span class="language-fill english"></span>
                            </div>
                        </div>

                        <div class="language-row">
                            <div class="language-heading">
                                <strong>Chinese</strong>
                                <span>Fluent</span>
                            </div>
                            <div class="language-track">
                                <span class="language-fill chinese"></span>
                            </div>
                        </div>

                        <div class="language-row">
                            <div class="language-heading">
                                <strong>Japanese</strong>
                                <span>Working proficiency</span>
                            </div>
                            <div class="language-track">
                                <span class="language-fill japanese"></span>
                            </div>
                        </div>

                        <div class="language-row">
                            <div class="language-heading">
                                <strong>Malay</strong>
                                <span>Fluent</span>
                            </div>
                            <div class="language-track">
                                <span class="language-fill malay"></span>
                            </div>
                        </div>

                    </div>
                `
            },

            "details": {
                title: "Hobbies",
                description: `
                    <div class="empty-section">
                        <div class="empty-icon">
                            <i class="fa-regular fa-heart"></i>
                        </div>
                        <span class="mini-label">BEYOND WORK</span>
                        <h3>A little more about me</h3>
                        <p>
                            This section is ready for your hobbies, interests,
                            favorite games, travel stories, pets, or anything
                            else you'd like visitors to discover.
                        </p>
                    </div>
                `
            },

            "pictures": {
                title: "Pictures",
                description: `
                    <div class="empty-section">
                        <div class="empty-icon">
                            <i class="fa-regular fa-images"></i>
                        </div>
                        <span class="mini-label">PHOTO GALLERY</span>
                        <h3>Little moments</h3>
                        <p>
                            Add your favorite photos here. You can turn this into
                            a proper gallery later with image cards and a lightbox.
                        </p>
                    </div>
                `
            },

            "connect": {
                title: "Connect",
                description: `
                    <div class="connect-section">
                        <span class="mini-label">LET'S CONNECT</span>
                        <h3>I'd love to hear from you.</h3>
                        <p>
                            Whether it's about work, collaboration, creative ideas,
                            or simply saying hello — feel free to reach out.
                        </p>

                        <div class="connect-links">
                            <a href="https://www.linkedin.com/in/julia-lim-b32570244/" target="_blank" rel="noopener">
                                <span><i class="fa-brands fa-linkedin-in"></i></span>
                                <div>
                                    <small>PROFESSIONAL</small>
                                    <strong>LinkedIn</strong>
                                </div>
                                <i class="fa-solid fa-arrow-up-right-from-square"></i>

                            <a href="https://www.instagram.com/julia.jy14/" target="_blank" rel="noopener">
                                <span><i class="fa-brands fa-instagram"></i></span>
                                <div>
                                    <small>SOCIAL</small>
                                    <strong>Instagram</strong>
                                </div>
                                <i class="fa-solid fa-arrow-up-right-from-square"></i>
                            </a>

                            <a href="https://www.facebook.com/julia.lim.5855" target="_blank" rel="noopener">
                                <span><i class="fa-brands fa-facebook-f"></i></span>
                                <div>
                                    <small>SOCIAL</small>
                                    <strong>Facebook</strong>
                                </div>
                                <i class="fa-solid fa-arrow-up-right-from-square"></i>
                            </a>
                        </div>
                    </div>
                `
            }
        };

        const overlay = document.getElementById("overlay");
        const card = document.getElementById("card");
        const title = document.getElementById("card-title");
        const description = document.getElementById("card-description");

        function showCard(id) {
            const content = cardContent[id];

            if (!content) return;

            title.textContent = content.title;
            description.innerHTML = content.description;

            overlay.classList.add("active");
            document.body.classList.add("modal-open");

            setTimeout(() => {
                document.querySelector(".modal-close").focus();
            }, 100);
        }

        function hideCard() {
            overlay.classList.remove("active");
            document.body.classList.remove("modal-open");
        }

        document.addEventListener("keydown", function(event) {
            if (event.key === "Escape") {
                hideCard();
            }
        });

        document.getElementById("year").textContent = new Date().getFullYear();
    </script>
</body>
</html>
